<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Redirecting...</title>
    <script>
      // GitHub Pages SPA fallback：
      // 当访问的路径不存在时，GH Pages 会返回 404.html。
      // 此脚本将 location 记录原始路径并跳转到 index.html。
      (function () {
        try {
          sessionStorage.setItem('spa-redirect-path', location.href);
        } catch (e) {
          // Safari 隐私模式下可能抛出，忽略。
        }
        // 检测是否在子路径部署（如 /WebLinuxOS/）
        var repo = location.pathname.match(/^\/([^/]+)\/?/);
        var base = repo ? '/' + repo[1] : '';
        location.replace(base + '/');
      })();
    </script>
    <noscript>
      <p><a href="./">点击这里返回 WebLinuxOS</a></p>
    </noscript>
  </head>
  <body></body>
</html>
